- name: Create current user with full permissions (when password specified)
  user:
    name: "{{ target_user }}"
    password: "{{ target_user_password | password_hash('sha512') }}"
    update_password: on_create
    shell: /bin/bash
    groups: sudo,dialout,plugdev,audio,video,input,tty,bluetooth,lp
    append: yes
    state: present
    create_home: yes
  when: target_user_password is defined

- name: Ensure current user is in required groups (without modifying password)
  user:
    name: "{{ target_user }}"
    shell: /bin/bash
    groups: sudo,dialout,plugdev,audio,video,input,tty,bluetooth,lp
    append: yes
    state: present
    create_home: yes
  when: target_user_password is not defined
