---
- name: install python3 and pip
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python-is-python3
    state: present

- name: ensure gh cli is present (using apt)
  apt:
    name: gh
    state: present

- name: check if nvm is installed
  stat:
    path: "/home/{{ target_user }}/.nvm/nvm.sh"
  register: nvm_script

- name: install nvm
  become_user: "{{ target_user }}"
  shell: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
  args:
    creates: "/home/{{ target_user }}/.nvm/nvm.sh"
  when: not ansible_check_mode

- name: install node via nvm
  become_user: "{{ target_user }}"
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    nvm install node
    nvm use node
  args:
    executable: /bin/bash
  when: nvm_script.stat.exists or not ansible_check_mode

- name: migrate gemini skills and agents to agy
  become_user: "{{ target_user }}"
  shell: |
    if [ -d "$HOME/.gemini" ]; then
      mkdir -p "$HOME/.agy"
      cp -rn "$HOME/.gemini/"* "$HOME/.agy/"
    fi
  args:
    executable: /bin/bash
  when: not ansible_check_mode

- name: install and link cta skills and cli tools
  become_user: "{{ target_user }}"
  shell: |
    bash "{{ playbook_dir }}/../desktop/configs/gemini/config/skills/install_cta.sh" --install
  args:
    executable: /bin/bash
  when: not ansible_check_mode

